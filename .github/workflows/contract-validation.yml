# Grabby Contract Validation
# Auto-generated by: grabby cicd

name: Contract Validation

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]
    paths:
      - 'contracts/**'

jobs:
  validate-contracts:
    name: Validate Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Detect active contracts
        id: contracts
        shell: bash
        run: |
          shopt -s nullglob
          contracts=(contracts/*.fc.md)
          if [ ${#contracts[@]} -eq 0 ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No active contracts found. Skipping contract validation."
            exit 0
          fi

          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "files=${contracts[*]}" >> "$GITHUB_OUTPUT"

      - name: Validate all contracts
        if: steps.contracts.outputs.found == 'true'
        shell: bash
        run: |
          echo "Validating contracts..."
          for contract in ${{ steps.contracts.outputs.files }}; do
            echo "Checking: $contract"
            node bin/index.cjs validate "$contract"
          done

      - name: Check for unapproved contracts
        if: steps.contracts.outputs.found == 'true'
        shell: bash
        run: |
          unapproved=$(grep -l "Status.*draft" ${{ steps.contracts.outputs.files }} 2>/dev/null || true)
          if [ -n "$unapproved" ]; then
            echo "::warning::Found draft contracts: $unapproved"
          fi

      - name: Generate metrics
        if: steps.contracts.outputs.found == 'true'
        run: node bin/index.cjs metrics > contract-metrics.json
        continue-on-error: true

      - name: Upload metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: contract-metrics
          path: contract-metrics.json
          retention-days: 30
        if: always() && steps.contracts.outputs.found == 'true'
